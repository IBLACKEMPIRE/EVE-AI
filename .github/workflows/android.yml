name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (core + app)
        run: ./gradlew :ai-brain:test :android-app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :android-app:lintDebug
      - name: Build debug APK
        run: ./gradlew :android-app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: eve-debug-apk
          path: android-app/build/outputs/apk/debug/android-app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            ai-brain/build/reports/tests
            android-app/build/reports
